site_name: OrcaSlicer for Mere Mortals
site_description: A slicer that turns 3D models into printer instructions on your own machine. Loading machine, process and filament profiles, slicing a model from the window and from the command line, proving the G-code by counting what is in it, and an honest account of where multicolor from the command line stops, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/orcaslicer-for-mere-mortals/
